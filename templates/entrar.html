{% extends "base.html" %}
{% block titulo %}Entrar · Treino{% endblock %}
{% block classe %}tela-form{% endblock %}
{% block corpo %}
<main class="cartao">
  <h1>Entrar</h1>
  <p class="sub">Bem-vindo de volta!</p>
  {% if erro %}<p class="erro" role="alert">{{ erro }}</p>{% endif %}
  <form method="post" novalidate>
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" value="{{ email }}" autocomplete="email" required>
    <label for="senha">Senha</label>
    <input id="senha" name="senha" type="password" autocomplete="current-password" required>
    <button class="btn" type="submit">Entrar</button>
  </form>
  {% include "_google.html" %}
  <p class="troca">Primeiro acesso? <a href="{{ url_for('cadastro') }}">Criar conta</a></p>
</main>
{% endblock %}
